# PostgreSQL 16 con pgvector para UniSmart AI (Docker Desktop en Windows)
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: unismart-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: unismart
      POSTGRES_PASSWORD: unismart_dev_2026
      POSTGRES_DB: unismart
    ports:
      - "5432:5432"
    volumes:
      - unismart_pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unismart -d unismart"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  unismart_pgdata:
