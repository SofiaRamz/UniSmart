.campus-map.leaflet-container {
  background: var(--map-ground);
  font-family: var(--font-sans);
  z-index: 0;
}
.campus-shape {
  stroke: var(--map-path);
  fill: var(--map-building);
  fill-opacity: 1;
}
.campus-shape.kind-perimetro {
  fill: var(--map-ground);
  stroke: var(--pine);
  stroke-dasharray: 6 5;
  stroke-opacity: 0.55;
}
.campus-shape.kind-edificio {
  fill: var(--map-building);
  stroke: var(--muted);
  stroke-opacity: 0.6;
}
.campus-shape.kind-area_verde, .campus-shape.kind-deportivo {
  fill: var(--map-green);
  stroke: var(--ok);
  stroke-opacity: 0.35;
}
.campus-shape.kind-estacionamiento {
  fill: var(--sunken);
  stroke: var(--map-path);
  stroke-dasharray: 3 3;
}
.campus-shape.kind-plaza {
  fill: var(--signal-soft);
  stroke: var(--signal);
  stroke-opacity: 0.45;
}
.campus-shape.kind-camino {
  fill: none;
  stroke: var(--map-path);
  stroke-dasharray: 2 6;
  stroke-linecap: round;
}
.campus-pin-wrap {
  background: transparent;
  border: 0;
}
.campus-pin {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 50% 50% 50% 4px;
  transform: rotate(-45deg);
  background: var(--pine);
  border: 2px solid var(--surface);
  box-shadow: 0 2px 6px rgb(0 0 0 / 0.28);
  transition: transform 0.15s ease;
}
.campus-pin > span {
  transform: rotate(45deg);
  font: 700 12px/1 var(--font-mono);
  color: var(--on-pine);
}
.campus-pin.kind-aula {
  background: var(--info);
}
.campus-pin.kind-oficina {
  background: var(--pine-deep);
}
.campus-pin.kind-servicio {
  background: var(--ok);
}
.campus-pin.kind-acceso, .campus-pin.kind-estacionamiento {
  background: var(--muted);
}
.campus-pin.kind-area_verde, .campus-pin.kind-deportivo {
  background: var(--ok);
}
.campus-pin.is-selected {
  background: var(--signal);
  transform: rotate(-45deg) scale(1.18);
}
.campus-pin.is-selected > span {
  color: var(--on-signal);
}
.campus-pick {
  display: block;
  width: 22px;
  height: 22px;
  border-radius: 999px;
  border: 3px solid var(--signal);
  background: var(--signal);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in oklab, var(--signal) 35%, transparent);
  }
}
.campus-map .leaflet-popup-content-wrapper, .campus-map .leaflet-popup-tip {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 6px 22px rgb(0 0 0 / 0.22);
}
.campus-map .leaflet-popup-content {
  margin: 12px 16px;
  font-size: 13.5px;
  line-height: 1.45;
}
.campus-map .leaflet-popup-content p {
  margin: 6px 0 0;
  color: var(--muted);
}
.campus-popup-kind {
  display: block;
  font: 600 10.5px/1.6 var(--font-mono);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--pine);
}
.campus-map .leaflet-bar a {
  background: var(--surface);
  color: var(--ink);
  border-bottom-color: var(--line);
}
.campus-map .leaflet-bar a:hover {
  background: var(--sunken);
}
.campus-map .leaflet-control-attribution {
  background: var(--surface);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in oklab, var(--surface) 85%, transparent);
  }
  color: var(--muted);
}
.campus-map .leaflet-control-attribution a {
  color: var(--pine);
}

@layer base {
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 {
    font-family: var(--font-display);
    text-wrap: balance;
    letter-spacing: -0.01em;
  }
  :focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 2px;
  }
}
@layer components {
  .tabular {
    font-variant-numeric: tabular-nums;
  }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: var(--surface);
  }
  .gutter {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .slot {
    border-left: 4px solid var(--slot, var(--pine));
    background: var(--slot, var(--pine));
    @supports (color: color-mix(in lab, red, red)) {
      background: color-mix(in oklab, var(--slot, var(--pine)) 12%, var(--surface));
    }
  }
  .typing span {
    display: inline-block;
    width: 6px;
    height: 6px;
    margin: 0 2px;
    border-radius: 999px;
    background: var(--muted);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) {
    animation-delay: 0.15s;
  }
  .typing span:nth-child(3) {
    animation-delay: 0.3s;
  }
  @keyframes blink {
    0%, 80%, 100% {
      opacity: 0.25;
    }
    40% {
      opacity: 1;
    }
  }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
